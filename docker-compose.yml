name: schoolos-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolos
      POSTGRES_PASSWORD: schoolos
      POSTGRES_DB: schoolos
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schoolos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: schoolos
      MINIO_ROOT_PASSWORD: schoolos123
    ports:
      # Host-side 19000/19001, not the "standard" 9000/9001 — found live this phase: something
      # outside Docker was already squatting 9000/6379 on the dev machine this was built on (not a
      # MinIO/Postgres/Redis process; connections reset rather than serving HTTP), which is why
      # every earlier phase's status notes flag "MinIO unreachable in this environment" despite
      # `docker compose up -d` succeeding — the container itself never actually started, silently.
      # `S3_ENDPOINT` in `.env.example` matches this mapping; the container's own internal port
      # (9000/9001) is unchanged, only the host mapping moved.
      - '19000:9000' # S3 API
      - '19001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
