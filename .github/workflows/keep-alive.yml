name: Keep-alive

# Render's free plan spins the web service down after ~15 min with no inbound traffic, so the
# next real visitor eats a 60+s cold start (frontend's SessionBootstrap now times out gracefully
# instead of hanging forever, but the cold start itself is still slow). This pings the public
# health endpoint often enough that the service never sees 15 idle minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 30 https://schoolos-backend-lc3i.onrender.com/v1/health
